name: Deploy

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# 同一分支/PR 的新 push 取消正在进行的部署
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # PR 预览链接评论

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 读取 package.json 的 packageManager 字段，自动装对应版本 pnpm
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CI 再挡一道（husky 只管本地提交）
      - run: pnpm lint && pnpm typecheck && pnpm test

      - run: pnpm build

      # wrangler 在仓库根执行（wrangler.jsonc 的 assets 目录指向 apps/web/dist）
      - name: Ensure Worker exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! pnpm exec wrangler deployments list > /dev/null 2>&1; then
            echo "Worker 尚不存在，先执行初始化 deploy"
            pnpm exec wrangler deploy
          else
            echo "Worker 已存在"
          fi

      # Workers 语义：tag 发版 → wrangler deploy 上生产（自定义域名由 Cloudflare 控制台管理）；
      # main push / PR → wrangler versions upload，只生成临时预览 URL，不碰生产
      - name: Determine deploy target
        id: target
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "prod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production (tag)
        if: steps.target.outputs.prod == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Upload preview version (main / PR)
        if: steps.target.outputs.prod == 'false'
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      # ---- apps/server：API Worker（D1 + R2；生产自定义域名在 Cloudflare 控制台配置）----
      # 一次性前置（手动，见 apps/server/README.md）：wrangler d1 create web-tools-db
      # 并把真实 database_id 填进 apps/server/wrangler.jsonc；wrangler r2 bucket create web-tools-assets

      # The optional API stays disabled until its local-only D1 placeholder is replaced.
      # 可选 API 在仅供本地使用的 D1 占位 ID 被替换前不参与部署。
      - name: Check API deployment configuration
        id: api
        run: |
          if grep -Eq '"database_id"[[:space:]]*:[[:space:]]*"00000000-0000-0000-0000-000000000000"' apps/server/wrangler.jsonc; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::API deployment skipped: configure the D1 database_id first (apps/server/README.md)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure API Worker exists
        if: steps.api.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! pnpm exec wrangler deployments list -c apps/server/wrangler.jsonc > /dev/null 2>&1; then
            echo "API Worker 尚不存在，先执行初始化 deploy"
            pnpm exec wrangler deploy -c apps/server/wrangler.jsonc
          else
            echo "API Worker 已存在"
          fi

      # 生产发版时先把新迁移应用到远程 D1，再部署 Worker（先库后码，避免新代码访问旧表结构）
      - name: Apply D1 migrations (remote, tag)
        if: steps.api.outputs.enabled == 'true' && steps.target.outputs.prod == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply web-tools-db --remote -c apps/server/wrangler.jsonc

      - name: Deploy API production (tag)
        if: steps.api.outputs.enabled == 'true' && steps.target.outputs.prod == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c apps/server/wrangler.jsonc

      - name: Upload API preview version (main / PR)
        if: steps.api.outputs.enabled == 'true' && steps.target.outputs.prod == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload -c apps/server/wrangler.jsonc

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.version-preview-url }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL
            const marker = '<!-- workers-preview -->'
            const body = `${marker}\n🚀 预览部署：${url}`
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            const existing = comments.find(c => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            }
            else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            }

shellEmulator: true

trustPolicy: no-downgrade

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # wrangler 的本地模拟运行时（postinstall 下载 workerd 二进制，wrangler dev 需要）
  workerd: true

# semver@6.3.1 发布于 npm provenance 机制之前，属 trustPolicy 已知误报
# （rolldown 等项目同样排除，见 https://github.com/rolldown/rolldown/pull/7302 ）
trustPolicyExclude:
  - semver@6.3.1
packages:
  - 'apps/*'
